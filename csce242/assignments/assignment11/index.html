<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacations</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <h1>Vacations</h1>
        <h2>Vacation Experiences</h2>
    </header>

    <main class="gallery-container" id="vacation-gallery"></main>

    <div id="vacation-modal" class="w3-modal">
        <div class="w3-modal-content w3-animate-zoom custom-modal-content">
            <span onclick="closeModal()" class="w3-button w3-display-topright close-btn">&times;</span>
            <div class="modal-body">
                <div class="modal-left">
                    <iframe id="modal-map" src="" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
                <div class="modal-right">
                    <h2 id="modal-title"></h2>
                    <p><strong>Type:</strong> <span id="modal-type"></span></p>
                    <p><strong class="highlight-blue">Description:</strong> <span id="modal-description"></span></p>
                    <p><strong class="highlight-blue">Things To Do:</strong> <span id="modal-things"></span></p>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>@nicolasgauvin</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
